name: Lightning Build
on:
  workflow_dispatch:
    inputs:
      tag: {required: true}
      appName: {required: true}
      packageId: {required: true}
      versionName: {required: true}
      versionCode: {required: true}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
        
      - name: Cache Base APK
        id: cache-base
        uses: actions/cache@v4
        with:
          path: base.apk
          key: base-apk-v3

      - name: Build Base APK (Sekali Saja)
        if: steps.cache-base.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/java/com/user/app app/src/main/assets app/src/main/res/values
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}' > settings.gradle
          echo 'dependencyResolutionManagement{repositories{google();mavenCentral()}}' >> settings.gradle
          echo 'rootProject.name="app"' >> settings.gradle
          echo "include ':app'" >> settings.gradle
          echo "plugins{id 'com.android.application' version '8.5.2' apply false}" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.user.app'
              compileSdk 34
              defaultConfig { applicationId "com.user.app" minSdk 24 targetSdk 34 versionCode 1 versionName "1.0" }
              buildTypes { release { minifyEnabled false signingConfig signingConfigs.debug } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.7.0' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="App" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">App</string></resources>
          EOF
          cat > app/src/main/java/com/user/app/MainActivity.java <<'EOF'
          package com.user.app;
          import android.annotation.SuppressLint; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.webkit.WebViewClient; import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @SuppressLint("SetJavaScriptEnabled") @Override protected void onCreate(Bundle b) {
                  super.onCreate(b); WebView w = new WebView(this); WebSettings s = w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); w.setWebViewClient(new WebViewClient()); w.loadUrl("file:///android_asset/index.html"); setContentView(w);
              }
          }
          EOF
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk base.apk

      - name: Patch & Resign (15 Detik)
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          java -jar apktool.jar d base.apk -o tmp -f
          
          cp app-source.html tmp/assets/index.html
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ inputs.appName }}<\/string>/g" tmp/res/values/strings.xml
          
          java -jar apktool.jar b tmp -o unsigned.apk
          
          keytool -genkey -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          zipalign -p 4 unsigned.apk aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out final.apk aligned.apk
          
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.appName }}
          files: final.apk
